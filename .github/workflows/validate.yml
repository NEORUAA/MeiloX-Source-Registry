name: Validate registry metadata

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  metadata:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out trusted validator
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false

      - name: Check trusted validation contracts
        run: python3 validate.py --test

      - name: Validate current index
        if: github.event_name != 'pull_request_target'
        run: python3 validate.py --index index.json

      - name: Read proposed index as data
        if: github.event_name == 'pull_request_target'
        env:
          PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import re
          import urllib.request

          repository = os.environ['PR_HEAD_REPOSITORY']
          commit = os.environ['PR_HEAD_SHA']
          if not re.fullmatch(r'[A-Za-z0-9][A-Za-z0-9-]{0,38}/[A-Za-z0-9_.-]{1,100}', repository) or not re.fullmatch(r'[a-f0-9]{40}', commit):
              raise SystemExit('Invalid PR identity')
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, request, file, code, message, headers, target):
                  return None
          opener = urllib.request.build_opener(NoRedirect)
          url = f'https://raw.githubusercontent.com/{repository}/{commit}/index.json'
          with opener.open(url, timeout=20) as response:
              data = response.read(256 * 1024 + 1)
              if len(data) > 256 * 1024:
                  raise SystemExit('Registry exceeds 256 KiB')
          Path(os.environ['RUNNER_TEMP'], 'proposed-index.json').write_bytes(data)
          PY

      - name: Validate proposed metadata with trusted policy
        if: github.event_name == 'pull_request_target'
        run: python3 validate.py --index "$RUNNER_TEMP/proposed-index.json"
